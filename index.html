<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dockerized Static Website</title>
    <style>
        :root {
            --primary-color: #2496ed; /* Docker Blue */
            --text-color: #333333;
            --bg-color: #f4f7f6;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-top: 8px solid var(--primary-color);
        }

        h1 {
            color: var(--primary-color);
            margin-top: 0;
            font-size: 2.5rem;
        }

        p {
            font-size: 1.1rem;
            color: #666666;
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-block;
            background-color: #e1f5fe;
            color: #0288d1;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #999999;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">🐳 Success</div>
        <h1>Hello from Docker!</h1>
        <p>Your static HTML website is running smoothly inside a lightweight Nginx container.</p>
        
        <div class="footer">
            Built with Nginx Alpine &bull; Managed by Docker
        </div>
    </div>

</body>
</html>
